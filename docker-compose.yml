services:
  api:
    build:
      context: ./backend
      dockerfile: src/PizzariaLucrativa.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Sqlite
      ConnectionStrings__DefaultConnection: "Data Source=/data/pizzaria-lucrativa.db"
      Jwt__Key: "troque-esta-chave-em-producao-pizzaria-lucrativa-0123456789-abcdef"
      Jwt__Issuer: PizzariaLucrativa
      Jwt__Audience: PizzariaLucrativa
      # Seed de demonstração: 10 sabores precificados (demo@pizzarialucrativa.com / Demo123).
      Seed__Demo: "true"
      Cors__AllowedOrigins__0: "http://localhost:8081"
    volumes:
      - pizzaria-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  pizzaria-data:
